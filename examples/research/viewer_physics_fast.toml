# Fast variant of viewer_physics.toml for interactive inspection.
# Synthetic preview profile: idealized mid-drive removes high-frequency chain and
# freehub states; use the strict file for drivetrain and energy studies.
physics_mode = "physical"
drive_mode = "articulated_effort"
timestep_s = 0.00125
closure_time_constant_s = 0.0025
initial_speed_mps = 3.0
initial_front_brake = 1.0
initial_rear_brake = 1.0
equilibrium_refine_after_s = 1.0
equilibrium_refine_period_s = 3.0
equilibrium_cache_enabled = true

[tires]
backend = "compliant_2d"
surface_mode = "track"

[tires.front]
mu = 1.1

[tires.rear]
mu = 1.1

[drive]
transmission_model = "ideal_mid_drive"
human_torque_nm = 20.0

[drive.assist]
gain = 4.0

[drive.gearing]
front_teeth = 34
rear_teeth = 51

[articulated]
pedal_c_ns_m = 100.0
posture_pitch_limit_nm = 120.0
