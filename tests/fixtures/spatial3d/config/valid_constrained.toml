# Request-only config: the future terrain producer resolves this asset.
physics_mode = "physical"
drive_mode = "coast"
spatial = "3d"

[spatial_3d]
root = "constrained"
corridor_half_width_m = 2.0

[spatial_3d.steer]
controller = "off"
torque_cap_nm = 12.0
reaction_delay_s = 0.0

[spatial_3d.terrain]
kind = "genspec"
path = "synthetic-grid.genspec.toml"
corridor_half_width_m = 2.0
max_asset_bytes = 1073741824
dx_m = 0.005
dy_m = 0.01

[spatial_3d.imu]
mount_pos_m = [0.02, -0.01, 0.03]
mount_rpy_rad = [0.1, -0.2, 0.3]
axis_misalignment_rad = [0.001, 0.002, -0.003]
calibration_revision = "synthetic-rig-v1"

[tires]
backend = "pneumatic_3d"

[tires.pneumatic_3d]
tier = "detailed"
lateral_coefficients = "mtb-provisional-v1"
