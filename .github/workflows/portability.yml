name: Linux and macOS portability

# Phase 3: root presets + native checker, with explicit package/coverage lanes.
# All Linux work runs in the pinned linux/arm64 container on an ARM64 host.
on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            lane: linux-aarch64-release
            preset: release
          - runner: ubuntu-24.04-arm
            lane: linux-aarch64-debug
            preset: debug
          - runner: macos-15
            lane: macos-arm64-release
            preset: release
    runs-on: ${{ matrix.runner }}
    env:
      BIKE_CI_LANE: ${{ matrix.lane }}
      BIKE_LINUX_CONTAINER: bike-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install macOS build and analysis tools
        if: ${{ runner.os == 'macOS' }}
        run: brew install cmake ninja llvm gcc cppcheck shellcheck jq
      - name: Run preset and native sweeps
        run: bash tools/ci_presets.sh '${{ matrix.preset }}'
      - name: Upload lane evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: portability-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci/${{ matrix.lane }}/
          if-no-files-found: warn
          retention-days: 30

  extended:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            lane: linux-aarch64-asan
            preset: asan
            mode: checks
          - runner: ubuntu-24.04-arm
            lane: linux-aarch64-coverage
            preset: coverage
            mode: checks
          - runner: macos-15
            lane: macos-arm64-asan
            preset: asan
            mode: checks
          - runner: macos-15
            lane: macos-arm64-coverage
            preset: coverage
            mode: checks
          - runner: ubuntu-24.04-arm
            lane: linux-xvfb-smoke
            preset: gui
            mode: gui-smoke
    runs-on: ${{ matrix.runner }}
    env:
      BIKE_CI_LANE: ${{ matrix.lane }}
      BIKE_LINUX_CONTAINER: bike-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install macOS build and analysis tools
        if: ${{ runner.os == 'macOS' }}
        run: brew install cmake ninja llvm gcc cppcheck shellcheck jq
      - name: Run preset, sweeps and selected gate
        run: bash tools/ci_presets.sh '${{ matrix.preset }}' '${{ matrix.mode }}'
      - name: Upload lane evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: portability-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci/${{ matrix.lane }}/
          if-no-files-found: warn
          retention-days: 30

  # Dispatch-only + protected environment + trusted runner labels are
  # retained. Pull-request code cannot enter these self-hosted lanes.
  trusted:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    environment: release-qualification
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: package-linux
            runner: [self-hosted, Linux, ARM64, bike-qualified]
            preset: release
            mode: package
          - lane: package-macos
            runner: [self-hosted, macOS, ARM64, bike-qualified]
            preset: release
            mode: package
          - lane: offline-rebuild-linux
            runner: [self-hosted, Linux, ARM64, bike-qualified]
            preset: release
            mode: offline
          - lane: macos-arm64-rtsan
            runner: [self-hosted, macOS, ARM64, bike-qualified]
            preset: rtsan
            mode: checks
    runs-on: ${{ matrix.runner }}
    env:
      BIKE_CI_LANE: ${{ matrix.lane }}
      BIKE_LINUX_CONTAINER: bike-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run qualified preset and selected gate
        run: bash tools/ci_presets.sh '${{ matrix.preset }}' '${{ matrix.mode }}'
      - name: Upload release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: portability-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci/${{ matrix.lane }}/
          if-no-files-found: warn
          retention-days: 90
