# Fast variant of viewer_physics.toml for interactive inspection.
# Synthetic preview profile: idealized mid-drive removes high-frequency chain and
# freehub states; use the strict file for drivetrain and energy studies.
physics_mode = "physical"
drive_mode = "articulated_effort"
timestep_s = 0.00125
closure_time_constant_s = 0.0025
initial_speed_mps = 0.0
initial_front_brake = 1.0
initial_rear_brake = 1.0
equilibrium_refine_after_s = 1.0
equilibrium_refine_period_s = 3.0
equilibrium_cache_enabled = true

[tires]
backend = "compliant_2d"
surface_mode = "track"

[tires.front]
mu = 1.1

[tires.rear]
mu = 1.1

[drive]
transmission_model = "ideal_mid_drive"
human_torque_nm = 20.0

[drive.pedaling]
enabled = true
coast_above_rpm = 110.0
resume_below_rpm = 90.0
stop_time_s = 0.35
# Low-cadence effort ramp: below mash_cadence_rpm the rider presses harder on
# the pedals and commanded effort ramps linearly toward mash_torque_nm at 0
# rpm. The ceiling is limited to what the articulated leg drive can actually
# transmit; higher values deepen pedal-stroke torque oscillation.
mash_cadence_rpm = 45.0
mash_torque_nm = 60.0
# Rider force development rate: a mash builds over ~0.1s, not instantly.
effort_slew_nm_s = 300.0
# Hill-hold reflex: sustained rollback faster than rollback_engage_mps grabs
# the wheel brakes until forward motion resumes (rollback_release_mps). This
# is a physical restraint -- it does not gate pedaling or assist intent.
rollback_brake = true
rollback_engage_mps = 0.25
rollback_release_mps = 0.0
rollback_demand = 1.0

[drive.assist]
gain = 4.0
tau = 0.3
stop_delay = 0.3
# Torque-sensor engagement: assist follows pedal force even at 0 rpm
# (hill start), like torque-sensing mid-drives.
engage_torque_nm = 4.0
# |crank rpm| that counts as shaft rotation for stall accounting.
spin_rpm = 15.0
# Max sustained assist torque while the shaft is not turning (thermal/antihold).
stall_timeout_s = 1.0
# Extended boost: hold the last assist target briefly after the rider torque
# drops while the cranks still turn forward (carries the wheel over ledges).
boost_s = 0.4

[drive.gearing]
front_teeth = 34
rear_teeth = 51

[drive.shifting]
enabled = true
cassette = [10, 12, 14, 16, 18, 21, 24, 28, 33, 39, 45, 51]
target_cadence_min_rpm = 65.0
target_cadence_max_rpm = 85.0
shift_cooldown_s = 0.4
shift_cut_duration_s = 0.2
torque_factor = 0.3
# Shift decisions use a filtered crank rate so a single power-stroke spike
# cannot trigger an upshift under climbing load.
cadence_smoothing_tau_s = 0.35

[articulated]
pedal_c_ns_m = 100.0
posture_pitch_limit_nm = 120.0
grip_release_distance_m = 0.30
