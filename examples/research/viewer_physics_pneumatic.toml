# Pneumatic-tyre research profile: the welded rider on the radial-carcass/brush
# tyre backend (docs/RIDE.md section 3.1). Rider pinned to the saddle (saddle
# pin, spindle foot connects, bar connects), ideal mid-drive, Bosch CX Gen 4
# assist (recalled, unverified). Requires the native PneumaticTireWriter.
physics_mode = "physical"
drive_mode = "articulated_effort"
timestep_s = 0.00125
closure_time_constant_s = 0.0025
initial_speed_mps = 0.0
initial_front_brake = 1.0
initial_rear_brake = 1.0
equilibrium_refine_after_s = 1.0
equilibrium_refine_period_s = 3.0
equilibrium_cache_enabled = true
# No pinned equilibrium_state_file: the first launch on a track settles (about
# 29k steps, ~10 s on rough_uphill_savage) and the auto-cache serves the pose
# afterwards. The old Python-era NPZ pin no longer loads natively.

[tires]
backend = "pneumatic"
surface_mode = "track"

[tires.pneumatic]
# "fast": 64 rays, no discretised brush, any timestep.
# "detailed": 256 rays + discretised brush, REQUIRES timestep_s = 0.00025 above.
tier = "fast"
# surface = "asphalt"   # only under surface_mode = "configured"; track mode reads the track's surface map

# Per-tyre spec overrides merge onto the defaults (FRONT_TYRE / REAR_TYRE) —
# a partial table like pressure_bar alone is enough.
# [tires.pneumatic.front]
# pressure_bar = 1.5
#
# [tires.pneumatic.rear]
# pressure_bar = 1.7

[drive]
# Real mid-drive topology: the chainring sits on the crank spindle (rigid
# crank/chainring through the torque sensor); the motor pushes through a
# one-way freewheel; the cassette freehub is the only other one-way element.
# RU: шатун жёстко со звездой, мотор через обгонную муфту. motor_clutch=true —
# legacy-топология (муфта шатун→вал) только для регрессионного A/B.
transmission_model = "ideal_mid_drive"
motor_clutch = false
# Reflected rotor inertia at the crank, kg*m^2. 0 = stateless rotor (the
# freewheel degenerates to tau_motor >= 0). ~0.1-0.3 is the recalled order of
# magnitude for a mid-drive (unverified); set >0 for an inertial-rotor A/B.
rotor_inertia_kgm2 = 0.0

[drive.pedaling]
enabled = true
# Coast/resume hysteresis on the EMA-filtered cadence (tau below): above
# coast_above_rpm the rider stops pressing, pedalling resumes below
# resume_below_rpm. RU: накат выше 120, возврат ниже 105; EMA убирает
# дёрганье от двух пульсаций момента за оборот.
coast_above_rpm = 120.0
resume_below_rpm = 105.0
coast_cadence_tau_s = 0.35
stop_time_s = 0.35
# Legacy low-cadence ramp; inactive while seated_climb supplies the effort.
mash_cadence_rpm = 45.0
mash_torque_nm = 60.0
effort_slew_nm_s = 300.0
# Rider's hand on the brake during rollback (until hill-hold D4 replaces it).
# RU: при откате быстрее 0.25 м/с райдер зажимает тормоза до остановки отката.
rollback_brake = true
rollback_engage_mps = 0.25
rollback_release_mps = 0.0
rollback_demand = 1.0

[drive.assist]
# Bosch Performance Line CX Gen 4 (no ABS), recalled from memory, unverified:
# 85 N*m, 600 W peak, 40 ms torque lag, Eco 0.6 / Tour 1.4 / eMTB 1.4-3.4 /
# Turbo 3.4, taper 23-25 km/h. The profile owns those numbers; only the
# cadence envelope and the engagement threshold are declared here.
# RU: режим ассиста: eco | tour | emtb | turbo. Мотор = множитель x момент
# на педалях через лаг 40 мс; ассист только при шатуне вперёд > 5 град/с и
# моменте стопы > engage_torque_nm. Stall-отсечки и boost нет.
profile = "bosch_cx_gen4"
mode = "turbo"
# Torque envelope vs crank rpm (crank == motor shaft with the rigid
# chainring). Plateau documents capability; above 120 rpm support declines
# to zero at 180 rpm.
torque_curve = [[0.0, 85.0], [120.0, 85.0], [120.1, 47.7], [180.0, 0.0]]
# Sensor noise floor: measured pedal torque below this is "not pedalling".
engage_torque_nm = 4.0

[drive.gearing]
front_teeth = 22
rear_teeth = 51

[drive.shifting]
enabled = true
cassette = [10, 12, 14, 16, 18, 21, 24, 28, 33, 39, 45, 51]
# RU: полоса каденса шатуна. Ниже 75 — на большую звезду (легче), выше 110 —
# на меньшую (тяжелее). Решение только по каденсу шатуна (EMA ниже);
# колёсный каденс используется лишь для проверки посадки на новую передачу.
target_cadence_min_rpm = 75.0
target_cadence_max_rpm = 110.0
shift_cooldown_s = 0.4
# RU: на время переключения райдер сбрасывает усилие до 30%; мотор НЕ
# режется — он следует за моментом райдера через свой лаг (спека S6).
shift_cut_duration_s = 0.2
torque_factor = 0.3
cadence_smoothing_tau_s = 0.35
upshift_slip_limit_mps = 0.5

[articulated]
# Muscle activation lag: commanded joint torque is filtered once per control
# tick through a first-order activation model. A real muscle cannot change
# force on the 1.25 ms physics step; without the lag each 5 ms tick step is a
# torque impulse that rings the compliant foot/grip/saddle welds, and the
# weld-velocity work the constraint ledger counts swamps the quiet pedaling
# the strict reference gates on. 25 ms is a sub-physiological activation
# constant (measured muscle lags are slower), chosen to put the kick above the
# weld band without delaying the rider's intent.
activation_tau_s = 0.025
balance_floor_kmh = 4.0
balance_dwell_s = 0.5
balance_grace_s = 3.0
road_lookahead_m = 2.0
pedal_attachment = "spindle"
saddle_attachment = "pin"
grip_attachment = "connect"
joint_envelope_path = "rider_joint_envelope_anatomical.json"
# Provisional directional strength sheet (verified=false curves). Engineering
# bounds only; the verified-provenance gate is a separate release decision.
joint_strength_path = "rider_strength_reference.json"
# Whole-body positive mechanical power cap: an engineering budget chosen in
# the requested 400-500 W band, not a physiological claim. This stays the
# *command* cap — it shapes what the controller asks, so it is plant physics,
# not a monitor knob.
active_positive_power_limit_w = 450.0
# F1 contract re-scope: the delivered-power verdict reads this monitor-side
# budget, not the command cap. The solved envelope runs above the cap because
# interval velocities drift inside a control period and the weld springs drag
# the legs through the backstroke — the measured model-delivery gap. Budget
# = 1.25x the largest delivered power observed across the five pinned-plant
# scenario shapes (max 596 W -> 750 W, per-joint 289 W -> 375 W); a run that
# exceeds it has a real energy-source defect, not a clipped command.
delivered_positive_power_budget_w = 750.0
delivered_joint_power_budget_w = 375.0
# F1 weld load envelope for the pinned plant. Connect equalities are
# bidirectional soft spring joints: they pull in tension and carry shear that
# a unilateral friction cone cannot express. These are declared hardware
# capacities bounding the solved weld load — never controller inputs — set at
# 1.25x the largest magnitude observed across the same five scenario shapes
# (foot tension -820 N, compression 2383 N, shear 1803 N; saddle tension
# -1800 N onset transient / -1501 N p01, compression 1054 N, shear 1024 N),
# consistent with clipless-pedal and saddle-rail retention ratings of order
# 1-3 kN. A solved load outside the envelope is a defect signal. Extrema are
# measured on the provisional strength sheet — audit status NOT ACCEPTED,
# curves recalled/unverified
# (docs/superpowers/audits/2026-10-04-seated-rider-closed-form.md) — so the
# envelope bounds this plant, not rated hardware.
weld_foot_min_normal_n = -1050.0
weld_foot_max_normal_n = 3000.0
weld_foot_shear_n = 2250.0
weld_saddle_min_normal_n = -2250.0
weld_saddle_max_normal_n = 1300.0
weld_saddle_shear_n = 1300.0
# Two-leg torque waveform depth mean*(1 + 0.5 cos 2phi): peak ~1.5x mean,
# dead spots ~0.5x. The bike's flywheel carries the cranks through the dead
# spots now that crank and chainring are rigid.
pedal_torque_ripple = 0.5
# Residual recovery-leg load on the rising pedal (recreational rider ~40-100 N,
# lower bound used; engineering estimate). Keeps the welded flat-pedal foot in
# compression -- a real foot cannot pull a flat pedal.
return_foot_preload_n = 40.0

[seated_climb]
enabled = true
# Rider holds ~250 W at the crank, torque-capped at 60 N*m (grinds below ~40 rpm).
target_crank_power_w = 250.0
max_crank_torque_nm = 60.0
surge_power_w = 400.0
surge_grade = 0.20
surge_budget_s = 15.0
surge_recovery_rate = 0.3333333333333333
front_load_share_target = 0.30
lean_trim_gain_rad_s = 0.3
lean_trim_limit_rad = 0.15
trim_dead_time_s = 0.2
