# EXPERIMENTAL, NOT VALIDATED: use rider_replay --mode open-loop.
# Synthetic diagnostic: isolate human drive/coast/resume; fixed 34/51 gear.
# Fast variant of viewer_physics.toml for interactive inspection.
# Synthetic preview profile: idealized mid-drive removes high-frequency chain and
# freehub states; use the strict file for drivetrain and energy studies.
physics_mode = "physical"
drive_mode = "articulated_effort"
timestep_s = 0.00125
closure_time_constant_s = 0.0025
initial_speed_mps = 0.0
initial_front_brake = 1.0
initial_rear_brake = 1.0
equilibrium_refine_after_s = 1.0
equilibrium_refine_period_s = 3.0
equilibrium_cache_enabled = true

[tires]
backend = "compliant_2d"
surface_mode = "track"

[tires.front]
mu = 1.1

[tires.rear]
mu = 1.1

[drive]
transmission_model = "ideal_mid_drive"
human_torque_nm = 0.0

[drive.pedaling]
enabled = true
# Гистерезис "крутит/не крутит": выше coast_above_rpm райдер перестаёт давить
# на педали (coasting, effort=0), чтобы снова крутить -- каденс должен упасть
# ниже resume_below_rpm. Зазор между порогами не даёт дёргать режим туда-сюда.
coast_above_rpm = 110.0
resume_below_rpm = 90.0
stop_time_s = 0.35
# Low-cadence effort ramp: below mash_cadence_rpm the rider presses harder on
# the pedals and commanded effort ramps linearly toward mash_torque_nm at 0
# rpm. The ceiling is limited to what the articulated leg drive can actually
# transmit; higher values deepen pedal-stroke torque oscillation.
# RU: "давит в горку". Ниже mash_cadence_rpm райдер встаёт на педаль, и effort
# линейно растёт от human_torque_nm до mash_torque_nm на 0 rpm. Надбавка
# никогда не снижает усилие ниже базового.
mash_cadence_rpm = 45.0
mash_torque_nm = 60.0
# Rider force development rate: a mash builds over ~0.1s, not instantly.
# RU: максимальная скорость нарастания усилия, Нм/с. Мышцы не выдают силу
# мгновенно -- рывок до mash_torque_nm строится за ~0.1 с, а не за один шаг.
# 0 отключает ограничение.
effort_slew_nm_s = 300.0
rollback_brake = false
# Hill-hold reflex: sustained rollback faster than rollback_engage_mps grabs
# the wheel brakes until forward motion resumes (rollback_release_mps). This
# is a physical restraint -- it does not gate pedaling or assist intent.
# RU: рефлекс удержания на подъёме. Если байк едет назад быстрее
# rollback_engage_mps (speed < -0.25), тормоза зажимаются с силой
rollback_engage_mps = 0.25
rollback_release_mps = 0.0
# rollback_demand (1.0 = в пол) и держатся, пока откат не остановится
# (speed > -rollback_release_mps). Это физический тормоз: педалирование и
# мотор продолжают работать, он просто не даёт укатиться вниз.
rollback_demand = 1.0

[drive.assist]
gain = 4.0
tau = 0.3
stop_delay = 0.3
max_torque = 85.0
max_power = 600.0
# Torque envelope vs crank rpm. The 600 W shaft cap already binds below
# 120 rpm (85 N*m * 12.57 rad/s = 1068 W > 600 W), so the curve's plateau
# just documents capability; the drop to 47.7 N*m = 600 W at 120 rpm puts
# the knee where the power ceiling hands over to the steeper falloff --
# above 120 rpm shaft torque AND power decline together to zero at 180 rpm.
torque_curve = [[0.0, 85.0], [120.0, 85.0], [120.1, 47.7], [180.0, 0.0]]
# Torque-sensor engagement: assist follows pedal force even at 0 rpm
# (hill start), like torque-sensing mid-drives.
engage_torque_nm = 4.0
# |crank rpm| that counts as shaft rotation for stall accounting.
spin_rpm = 15.0
# Max sustained assist torque while the shaft is not turning (thermal/antihold).
stall_timeout_s = 1.0
# Extended boost: hold the last assist target briefly after the rider torque
# drops while the cranks still turn forward (carries the wheel over ledges).
boost_s = 0.4

[drive.battery]
# No energy store: electrical power is still metered, but torque is never
# energy-limited and the reserve is never depleted.
enabled = false

[drive.gearing]
front_teeth = 34
rear_teeth = 51

[drive.shifting]
enabled = false
cassette = [10, 12, 14, 16, 18, 21, 24, 28, 33, 39, 45, 51]
# RU: целевая полоса каденса райдера, об/мин. Выше max (крутит слишком
# быстро) -- переключение на меньшую звезду (тяжелее передача), ниже min
# (давит с трудом) -- на большую звезду (легче). Внутри полосы ничего
# не делает.
target_cadence_min_rpm = 80.0
target_cadence_max_rpm = 110.0
# RU: минимальная пауза между переключениями, чтобы система не щёлкала
# передачами туда-сюда каждый шаг симуляции.
shift_cooldown_s = 0.4
# RU: длительность "срезки" момента при переключении. Как на реальном байке:
# на мгновение ослабляешь нажим, иначе цепь перекидывается под нагрузкой.
shift_cut_duration_s = 0.2
# RU: во сколько раз срезается момент на время shift_cut_duration_s.
# 0.3 = остаётся 30% усилия на педалях и моторе, пока цепь переходит
# на новую звезду. 1.0 отключает срезку, 0.0 -- полное снятие тяги.
torque_factor = 0.3
# Shift decisions use a filtered crank rate so a single power-stroke spike
# cannot trigger an upshift under climbing load.
# RU: постоянная времени экспоненциального фильтра (EMA) каденса, с.
# Момент на педалях пульсирует дважды за оборот, поэтому "сырой" каденс
# дёргается; без фильтра один сильный толчок ногой на подъёме дал бы
# кратковременный всплеск rpm и вызвал ложный upshift. 0 отключает фильтрацию.
cadence_smoothing_tau_s = 0.35
# RU: верхний предел пробуксовки заднего колеса, м/с, при котором апшифт
# запрещён. Буксующее колесо раскручивается без разгона байка и завышает
# implied каденс — реальный райдер не переключается вверх на пробуксовке.
upshift_slip_limit_mps = 0.5

[articulated]
pedal_c_ns_m = 100.0
posture_pitch_limit_nm = 120.0
grip_release_distance_m = 0.30
